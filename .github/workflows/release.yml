# Builds the release APK for a version tag (vX.Y.Z or vX.Y.Z-rcN) and publishes it as a GitHub
# Release with the notes of that version from CHANGELOG.md. See RELEASING.md.
#
# With the UG_KEYSTORE_* secrets set, the APK is signed with the release key. Without them it is
# signed with the debug key, which is installable but not suitable for distribution, and the
# release notes say so.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Check that the tag matches appVersion
        run: |
          version=$(grep '^appVersion=' gradle.properties | cut -d= -f2)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match appVersion $version"; exit 1; }

      - name: Check and build the release APK
        env:
          UG_KEYSTORE_BASE64: ${{ secrets.UG_KEYSTORE_BASE64 }}
          UG_KEYSTORE_PASSWORD: ${{ secrets.UG_KEYSTORE_PASSWORD }}
          UG_KEY_ALIAS: ${{ secrets.UG_KEY_ALIAS }}
          UG_KEY_PASSWORD: ${{ secrets.UG_KEY_PASSWORD }}
        run: |
          if [ -n "$UG_KEYSTORE_BASE64" ]; then
            export UG_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
            echo "$UG_KEYSTORE_BASE64" | base64 -d > "$UG_KEYSTORE_FILE"
            echo "SIGNED=release" >> "$GITHUB_ENV"
          else
            echo "SIGNED=debug" >> "$GITHUB_ENV"
          fi
          ./gradlew check assembleRelease
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {found=1; next} found && /^## \[/ {exit} found {print}' CHANGELOG.md > notes.md
          if [ "$SIGNED" = "debug" ]; then
            printf '\n> **Note:** this APK is signed with the debug key because no release signing key is configured. It is installable for testing, but it is not a distribution build.\n' >> notes.md
          fi
          apk="UltimatePhone-$version.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          gh release create "$GITHUB_REF_NAME" "$apk" --title "UltimatePhone $version" --notes-file notes.md --prerelease
